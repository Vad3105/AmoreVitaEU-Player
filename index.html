<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AmoreVitaEU — Подкасты о любви</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 20% 10%,#49253d 0,transparent 42%),linear-gradient(145deg,#110f1e,#251626 75%,#100e1a);color:#fff;padding:24px}.card{width:min(100%,470px);padding:28px;border:1px solid #ffffff25;border-radius:28px;background:#ffffff0d;box-shadow:0 24px 70px #0007;backdrop-filter:blur(18px)}.brand{text-align:center;letter-spacing:.09em;color:#f9c6d5;font-weight:800;font-size:1.4rem}.tag{text-align:center;color:#cbb8c7;font-size:.8rem;margin:6px 0 24px}.cover{aspect-ratio:1.35;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 30%,#d36f8d,#7e355c 45%,#2d1b3c);box-shadow:inset 0 0 60px #0004}.heart{font-size:76px;filter:drop-shadow(0 8px 15px #0005)}.cover span{font-size:.85rem;letter-spacing:.22em;text-transform:uppercase}.eyebrow{margin:25px 0 5px;color:#f3a7bf;font-size:.75rem;text-transform:uppercase;letter-spacing:.14em}h1{font-size:1.45rem;line-height:1.3;margin:0 0 8px}.desc{color:#cbbbc8;font-size:.92rem;line-height:1.5;margin:0 0 24px}.progress{width:100%;accent-color:#f1a2bd;cursor:pointer}.times{display:flex;justify-content:space-between;color:#b7a8b8;font-size:.78rem}.controls{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0 18px}button{border:0;color:white;background:none;cursor:pointer;font-size:1.2rem}#play{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#f3a2bd,#b8537f);font-size:1.65rem;box-shadow:0 8px 22px #a63d7566}button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:4px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#cbbbc8;font-size:.8rem}.bottom input{width:105px;accent-color:#f1a2bd}.status{min-height:1.4em;color:#ffc1c1;font-size:.78rem;margin-top:15px;text-align:center}.foot{text-align:center;margin-top:15px;color:#b9a3b5;font-size:.75rem}
</style>
</head>
<body><main class="card"><div class="brand">AmoreVitaEU</div><div class="tag">О любви, отношениях и совместимости</div><div class="cover" aria-label="Обложка подкаста"><div class="heart">♥</div><span>Подкасты о любви</span></div><p class="eyebrow">Аудиоподкаст</p><h1>Психология любви и совместимости</h1><p class="desc">Разговор о чувствах, отношениях и взаимопонимании.</p><audio id="audio" preload="metadata" controlsList="nodownload" disablePictureInPicture></audio><input class="progress" id="seek" aria-label="Перемотка" type="range" min="0" max="1000" value="0"><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div><div class="controls"><button id="back" aria-label="Назад на 15 секунд">↶ 15</button><button id="play" aria-label="Воспроизвести">▶</button><button id="forward" aria-label="Вперёд на 15 секунд">15 ↷</button></div><div class="bottom"><label for="volume">Громкость</label><input id="volume" aria-label="Громкость" type="range" min="0" max="1" step="0.05" value="1"><span id="speed">1×</span><button id="speedBtn" aria-label="Скорость воспроизведения">Скорость</button></div><div class="status" id="status"></div><div class="foot">© AmoreVitaEU · Слушайте с удовольствием</div></main>
<script>
// После настройки сервера укажите адрес потокового endpoint здесь.
// Пример: const STREAM_URL = '/api/audio/first-episode';
const STREAM_URL = '';
const audio=document.getElementById('audio'),play=document.getElementById('play'),seek=document.getElementById('seek'),status=document.getElementById('status');
if(STREAM_URL){audio.src=STREAM_URL;}else{status.textContent='Аудиозапись будет доступна после подключения сервера.';}
const fmt=s=>Number.isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'0:00';
function update(){document.getElementById('current').textContent=fmt(audio.currentTime);document.getElementById('duration').textContent=fmt(audio.duration);seek.value=Number.isFinite(audio.duration)&&audio.duration>0?Math.round(audio.currentTime/audio.duration*1000):0;play.textContent=audio.paused?'▶':'❚❚';play.setAttribute('aria-label',audio.paused?'Воспроизвести':'Пауза');}
play.onclick=async()=>{if(!STREAM_URL)return;if(audio.paused){try{await audio.play();status.textContent='';}catch{status.textContent='Не удалось воспроизвести запись.';}}else audio.pause();};
document.getElementById('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);document.getElementById('forward').onclick=()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+15);seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=seek.value/1000*audio.duration;};document.getElementById('volume').oninput=e=>audio.volume=Number(e.target.value);
const speeds=[1,1.25,1.5,1.75,2,.75];let speedIndex=0;document.getElementById('speedBtn').onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;audio.playbackRate=speeds[speedIndex];document.getElementById('speed').textContent=speeds[speedIndex]+'×';};
['timeupdate','loadedmetadata','durationchange','play','pause','ended'].forEach(event=>audio.addEventListener(event,update));audio.addEventListener('error',()=>status.textContent='Ошибка загрузки аудио.');
</script></body></html>
